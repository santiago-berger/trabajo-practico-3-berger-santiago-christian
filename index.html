<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Personajes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="header text-center py-4">
      <div class="container">
        <h1 class="titulo">Los Simpson</h1>
        <p class="subtitulo mb-0">Explorá los personajes de Springfield</p>
      </div>
    </header>

    <main class="container my-4">
      <!-- buscador -->
      <section class="buscador-seccion mb-4">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <div class="input-group">
              <input
                type="text"
                id="inputBuscador"
                class="form-control"
                placeholder="Buscar personaje por nombre..."
                aria-label="Buscar personaje"
              />
              <button
                id="btnBuscar"
                type="button"
                class="btn btn-warning fw-semibold"
              >
                Buscar
              </button>
              <button id="btnLimpiar" type="button" class="btn btn-secondary">
                Limpiar
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- mensajes de estado -->
      <div id="mensajeEstado" class="text-center my-3"></div>

      <!-- contenedor de tarjetas -->
      <section
        id="contenedor"
        class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
      ></section>

      <!-- modal de detalle del personaje -->
      <div
        class="modal fade"
        id="modal"
        tabindex="-1"
        aria-labelledby="modalTitulo"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-4" id="modalTitulo"></h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body" id="modalCuerpo">
              <!-- el contenido se agrega con JavaScript -->
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cerrar
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer text-center py-3 mt-4">
      <p class="subtitulo mb-0">&copy; Santiago Christian Berger</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
